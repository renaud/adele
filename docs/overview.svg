<svg xmlns="http://www.w3.org/2000/svg" width="960" height="476" viewBox="0 0 960 476" role="img" aria-labelledby="title desc">
  <title id="title">adele: from a source to an answer</title>
  <desc id="desc">The adele server gets rows from public sources and passes them through four stages: fetch, check, store and serve. A person who knows a dataset writes its folder (datapackage.yaml, fetch.py and checks.yaml), and the stage check compares the rows with it. An agent asks the server and gets answers. It runs the adele CLI: adele list, adele describe and adele query.</desc>

  <!-- Hand-written. Colours, sizes and stroke widths are classes, with a dark variant at the end of the style block.
       Row 1 (y 20-236): sources x 20-204, server x 240-716, agent x 772-940. A stage of the server is 96 wide, and the next one starts 116 further.
       Row 2 (y 266-456): dataset folder x 20-470, CLI x 500-940. The three lines of both boxes share their baselines (370, 402, 434). -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328 }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px }
    .sm { font-size: 11px }
    .s12 { font-size: 12px }
    .chip { font-size: 12.5px }
    .h { font-size: 15px; font-weight: 600 }
    .hh { font-size: 17px; font-weight: 600 }
    .b { font-weight: 600 }
    .num { font-size: 11.5px; font-weight: 600 }
    .m { fill: #59636e }
    .bg { fill: #ffffff }
    .chassis { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5 }
    .bezel { fill: #24292f }
    .on-bezel { fill: #ffffff }
    .unit { fill: #ffffff; stroke: #d0d7de }
    .hinge { stroke: #1f2328; stroke-width: 1.5 }
    .led { fill: #2da44e }
    .src { fill: #ddf4ff; stroke: #54aeff }
    .src-in { fill: #ffffff; stroke: #54aeff }
    .decl { fill: #fff8c5; stroke: #d4a72c }
    .agent { fill: #fbefff; stroke: #c297ff }
    .t-decl { fill: #9a6700 }
    .ic { fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round }
    .ic-decl { stroke: #9a6700 }
    .ic-agent { stroke: #8250df }
    .ic-n { stroke: #1f2328 }
    .f-agent { fill: #8250df; stroke: none }
    .l { fill: none; stroke: #57606a; stroke-width: 1.6 }
    .a { fill: #57606a }
    .l-num { fill: none; stroke: #8250df; stroke-width: 1.2 }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3 }
      .m { fill: #9198a1 }
      .bg { fill: #0d1117 }
      .chassis { fill: #161b22; stroke: #6e7681 }
      .bezel { fill: #30363d }
      .on-bezel { fill: #ffffff }
      .unit { fill: #0d1117; stroke: #30363d }
      .hinge { stroke: #e6edf3 }
      .led { fill: #3fb950 }
      .src { fill: #10243e; stroke: #1f6feb }
      .src-in { fill: #0d1117; stroke: #1f6feb }
      .decl { fill: #2b2111; stroke: #9e6a03 }
      .agent { fill: #231a3a; stroke: #8957e5 }
      .t-decl { fill: #d29922 }
      .ic-decl { stroke: #d29922 }
      .ic-agent { stroke: #a371f7 }
      .ic-n { stroke: #e6edf3 }
      .f-agent { fill: #a371f7 }
      .l { stroke: #9198a1 }
      .a { fill: #9198a1 }
      .l-num { stroke: #a371f7 }
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="a" d="M0 0.5 L8 4 L0 7.5 z"/></marker>
  </defs>

  <rect class="bg" width="960" height="476"/>

  <!-- sources: one chip per source -->
  <rect class="src" x="20" y="20" width="184" height="216" rx="8"/>
  <text x="32" y="44" class="h">Sources</text>
  <text x="192" y="44" class="m" text-anchor="end">public data</text>
  <rect class="src-in" x="32" y="56" width="68" height="24" rx="12"/>
  <text x="66" y="72.5" class="chip" text-anchor="middle">ENTSO-E</text>
  <rect class="src-in" x="106" y="56" width="76" height="24" rx="12"/>
  <text x="144" y="72.5" class="chip" text-anchor="middle">Swissgrid</text>
  <rect class="src-in" x="32" y="86" width="66" height="24" rx="12"/>
  <text x="65" y="102.5" class="chip" text-anchor="middle">Pronovo</text>
  <rect class="src-in" x="104" y="86" width="86" height="24" rx="12"/>
  <text x="147" y="102.5" class="chip" text-anchor="middle">MeteoSwiss</text>
  <rect class="src-in" x="32" y="116" width="88" height="24" rx="12"/>
  <text x="76" y="132.5" class="chip" text-anchor="middle">Open-Meteo</text>
  <rect class="src-in" x="126" y="116" width="62" height="24" rx="12"/>
  <text x="157" y="132.5" class="chip" text-anchor="middle">ECMWF</text>
  <rect class="src-in" x="32" y="146" width="102" height="24" rx="12"/>
  <text x="83" y="162.5" class="chip" text-anchor="middle">Energy-Charts</text>
  <rect class="src-in" x="32" y="176" width="106" height="24" rx="12"/>
  <text x="85" y="192.5" class="chip" text-anchor="middle">WeatherNext 3</text>
  <text x="32" y="222" class="m s12">APIs, files, Zarr stores</text>

  <!-- server: one appliance, four stages -->
  <rect class="chassis" x="240" y="20" width="476" height="216" rx="10"/>
  <path class="bezel" d="M240 30 a10 10 0 0 1 10 -10 h456 a10 10 0 0 1 10 10 v28 h-476 z"/>
  <circle class="led" cx="262" cy="39" r="4.5"/>
  <text x="276" y="45" class="hh on-bezel">adele server</text>

  <rect class="unit" x="256" y="74" width="96" height="146" rx="6"/>
  <g class="ic ic-n" transform="translate(284.5 92) scale(1.3)"><path d="M15 4 v15 M8.5 12.5 l6.5 6.5 l6.5 -6.5 M5 22 v4 h20 v-4"/></g>
  <text x="304" y="162" class="h" text-anchor="middle">fetch</text>
  <text x="304" y="182" class="m s12" text-anchor="middle">by fetch.py,</text>
  <text x="304" y="197" class="m s12" text-anchor="middle">on a schedule</text>

  <rect class="unit hinge" x="372" y="74" width="96" height="146" rx="6"/>
  <g class="ic ic-n" transform="translate(400.5 92) scale(1.3)"><circle cx="15" cy="15" r="11.5"/><path d="M9.5 15.5 l4 4 l7.5 -8.5"/></g>
  <text x="420" y="162" class="h" text-anchor="middle">check</text>
  <text x="420" y="182" class="m s12" text-anchor="middle">against the</text>
  <text x="420" y="197" class="m s12" text-anchor="middle">declaration</text>

  <rect class="unit" x="488" y="74" width="96" height="146" rx="6"/>
  <g class="ic ic-n" transform="translate(516.5 92) scale(1.3)"><ellipse cx="15" cy="7.5" rx="10" ry="4"/><path d="M5 7.5 v15 a10 4 0 0 0 20 0 v-15 M5 15 a10 4 0 0 0 20 0"/></g>
  <text x="536" y="162" class="h" text-anchor="middle">store</text>
  <text x="536" y="182" class="m s12" text-anchor="middle">Parquet files,</text>
  <text x="536" y="197" class="m s12" text-anchor="middle">time in UTC</text>

  <rect class="unit" x="604" y="74" width="96" height="146" rx="6"/>
  <g class="ic ic-n" transform="translate(632.5 92) scale(1.3)"><path d="M5 10.5 h19 M19.5 6 l4.5 4.5 l-4.5 4.5 M25 19.5 h-19 M10.5 15 l-4.5 4.5 l4.5 4.5"/></g>
  <text x="652" y="162" class="h" text-anchor="middle">serve</text>
  <text x="652" y="182" class="m s12" text-anchor="middle">the card, and</text>
  <text x="652" y="197" class="m s12" text-anchor="middle">capped SQL</text>

  <!-- arrows: sources to fetch, stage to stage, folder to check, serve and agent, agent to CLI -->
  <line class="l" x1="204" y1="147" x2="254" y2="147" marker-end="url(#a)"/>
  <line class="l" x1="354" y1="147" x2="370" y2="147" marker-end="url(#a)"/>
  <line class="l" x1="470" y1="147" x2="486" y2="147" marker-end="url(#a)"/>
  <line class="l" x1="586" y1="147" x2="602" y2="147" marker-end="url(#a)"/>
  <line class="l" x1="420" y1="286" x2="420" y2="222" marker-end="url(#a)"/>
  <line class="l" x1="772" y1="136" x2="702" y2="136" marker-end="url(#a)"/>
  <line class="l" x1="700" y1="158" x2="770" y2="158" marker-end="url(#a)"/>
  <line class="l" x1="856" y1="236" x2="856" y2="284" marker-end="url(#a)"/>

  <!-- agent -->
  <rect class="agent" x="772" y="20" width="168" height="216" rx="10"/>
  <g class="ic ic-agent" transform="translate(812 46) scale(2)">
    <circle class="f-agent" cx="22" cy="4" r="2.6"/>
    <path d="M22 6.5 v5"/>
    <rect x="6" y="11.5" width="32" height="25" rx="7"/>
    <circle class="f-agent" cx="16" cy="22.5" r="3"/>
    <circle class="f-agent" cx="28" cy="22.5" r="3"/>
    <path d="M17 30 h10"/>
    <path d="M2.5 20 v8 M41.5 20 v8"/>
  </g>
  <text x="856" y="168" class="hh" text-anchor="middle">Agent</text>
  <text x="856" y="189" class="m" text-anchor="middle">taught by the</text>
  <text x="856" y="205" class="m" text-anchor="middle">adele skill</text>

  <!-- dataset folder -->
  <path class="decl box" d="M20 274 a8 8 0 0 1 8 -8 h104 l14 20 h316 a8 8 0 0 1 8 8 v154 a8 8 0 0 1 -8 8 h-434 a8 8 0 0 1 -8 -8 z"/>
  <text x="32" y="281" class="mono sm t-decl">datasets/&lt;id&gt;/</text>
  <g class="ic ic-decl" transform="translate(32 298)">
    <circle cx="9" cy="5" r="3.8"/>
    <path d="M1.5 17 a7.5 6.5 0 0 1 15 0"/>
  </g>
  <text x="58" y="313" class="h">Dataset folder</text>
  <text x="34" y="334" class="m">written by a person who knows the dataset</text>
  <text x="34" y="370" class="mono b">datapackage.yaml</text>
  <text x="176" y="370">what a row is, units, codes, warnings</text>
  <text x="34" y="402" class="mono b">fetch.py</text>
  <text x="176" y="402">gets the rows from the source</text>
  <text x="34" y="434" class="mono b">checks.yaml</text>
  <text x="176" y="434">published figures that the data reproduces</text>

  <!-- the CLI: what the agent runs -->
  <rect class="agent" x="500" y="286" width="440" height="170" rx="10"/>
  <text x="514" y="313" class="h">adele CLI</text>

  <circle class="l-num" cx="522" cy="366" r="8"/>
  <text x="522" y="370" class="num" text-anchor="middle">1</text>
  <text x="537" y="370" class="mono b">adele list</text>
  <text x="704" y="370">what exists, and how fresh</text>

  <circle class="l-num" cx="522" cy="398" r="8"/>
  <text x="522" y="402" class="num" text-anchor="middle">2</text>
  <text x="537" y="402" class="mono b">adele describe &lt;id&gt;</text>
  <text x="704" y="402">the card: grain, units, warnings</text>

  <circle class="l-num" cx="522" cy="430" r="8"/>
  <text x="522" y="434" class="num" text-anchor="middle">3</text>
  <text x="537" y="434" class="mono b">adele query "&lt;sql&gt;"</text>
  <text x="704" y="434">rows, then units and warnings</text>
</svg>
