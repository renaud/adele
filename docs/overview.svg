<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">adele: from a source to an answer</title>
  <desc id="desc">A person who knows a dataset writes its folder: datapackage.yaml, fetch.py and checks.yaml. The adele server fetches the rows from the source, checks them against that declaration, stores them as Parquet and serves the dataset card and SQL queries to agents. A fetch or a check that fails sets the status of the dataset to failing.</desc>

  <!-- Hand-written. Colours are classes, with a dark variant at the end of the style block.
       Grid: left column x 20-240, server x 300-692, agent x 744-940. Stage rows are 68 high, 22 apart. -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #1f2328 }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px }
    .h { font-size: 14px; font-weight: 600 }
    .b { font-weight: 600 }
    .title { font-size: 22px }
    .sub { font-size: 13.5px }
    .lab { font-size: 12px }
    .num { font-size: 11px; font-weight: 600 }
    .m { fill: #59636e }
    .bg { fill: #ffffff }
    .frame { fill: #f6f8fa; stroke: #d0d7de }
    .stage { fill: #ffffff; stroke: #d0d7de }
    .hinge { stroke: #1f2328; stroke-width: 1.5 }
    .src { fill: #ddf4ff; stroke: #54aeff }
    .decl { fill: #fff8c5; stroke: #d4a72c }
    .t-data { fill: #0969da }
    .t-decl { fill: #9a6700 }
    .ok { fill: #1a7f37 }
    .bad { fill: #cf222e }
    .l { fill: none; stroke: #1f2328; stroke-width: 1.5 }
    .l-data { fill: none; stroke: #0969da; stroke-width: 1.5 }
    .l-decl { fill: none; stroke: #9a6700; stroke-width: 1.5 }
    .l-m { fill: none; stroke: #59636e; stroke-width: 1.2 }
    .glyph { stroke-width: 1.3 }
    .key { stroke-width: 2.5 }
    .sep { stroke: #d0d7de; stroke-dasharray: 3 3 }
    .a { fill: #1f2328 }
    .a-data { fill: #0969da }
    .a-decl { fill: #9a6700 }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3 }
      .m { fill: #9198a1 }
      .bg { fill: #0d1117 }
      .frame { fill: #161b22; stroke: #30363d }
      .stage { fill: #0d1117; stroke: #30363d }
      .hinge { stroke: #e6edf3 }
      .src { fill: #10243e; stroke: #1f6feb }
      .decl { fill: #2b2111; stroke: #9e6a03 }
      .t-data { fill: #58a6ff }
      .t-decl { fill: #d29922 }
      .ok { fill: #3fb950 }
      .bad { fill: #f85149 }
      .l { stroke: #e6edf3 }
      .l-data { stroke: #58a6ff }
      .l-decl { stroke: #d29922 }
      .l-m { stroke: #9198a1 }
      .sep { stroke: #30363d }
      .a { fill: #e6edf3 }
      .a-data { fill: #58a6ff }
      .a-decl { fill: #d29922 }
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="a" d="M0 0.5 L8 4 L0 7.5 z"/></marker>
    <marker id="a-data" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="a-data" d="M0 0.5 L8 4 L0 7.5 z"/></marker>
    <marker id="a-decl" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="a-decl" d="M0 0.5 L8 4 L0 7.5 z"/></marker>
  </defs>

  <rect class="bg" width="960" height="560"/>

  <!-- title -->
  <text x="20" y="38" class="title"><tspan class="b">adele</tspan><tspan class="m" font-size="15" dx="10">agentic data layer</tspan></text>
  <text x="20" y="62" class="m sub">A person declares what a dataset is. The server fetches the data, checks it against the declaration and serves both to agents.</text>

  <!-- sources -->
  <rect class="src" x="20" y="84" width="220" height="108" rx="8"/>
  <ellipse class="l-data" cx="42" cy="101" rx="8" ry="3"/>
  <path class="l-data" d="M34 101 v10 a8 3 0 0 0 16 0 v-10"/>
  <text x="58" y="111" class="h">Sources</text>
  <text x="34" y="135">Public data on electricity</text>
  <text x="34" y="152">markets: APIs, csv, xlsx,</text>
  <text x="34" y="169">Parquet, SQL databases.</text>

  <!-- dataset folder -->
  <rect class="decl" x="20" y="214" width="220" height="248" rx="8"/>
  <circle class="l-decl" cx="42" cy="233" r="4.5"/>
  <path class="l-decl" d="M33.5 247 a8.5 7.5 0 0 1 17 0"/>
  <text x="58" y="243" class="h">Dataset folder</text>
  <text x="34" y="266" class="m">written by a person who knows</text>
  <text x="34" y="282" class="m">the dataset, kept in git</text>
  <text x="34" y="310" class="mono b">datapackage.yaml</text>
  <text x="34" y="327">what a row is, units, codes,</text>
  <text x="34" y="343">warnings, example queries</text>
  <text x="34" y="371" class="mono b">fetch.py</text>
  <text x="34" y="388">gets rows from the source</text>
  <text x="34" y="416" class="mono b">checks.yaml</text>
  <text x="34" y="433">figures published by others</text>
  <text x="34" y="449">that the data must reproduce</text>

  <!-- legend -->
  <line class="l-data key" x1="20" y1="494" x2="44" y2="494"/>
  <text x="52" y="498" class="m">data from the source</text>
  <line class="l-decl key" x1="20" y1="516" x2="44" y2="516"/>
  <text x="52" y="520" class="m">what the person declared</text>

  <!-- server -->
  <rect class="frame" x="300" y="84" width="392" height="456" rx="10"/>
  <text x="316" y="111" class="h">adele server</text>
  <text x="676" y="111" class="m" text-anchor="end">always on</text>

  <rect class="stage" x="316" y="124" width="360" height="68" rx="6"/>
  <text x="332" y="163" class="h">fetch</text>
  <text x="396" y="154">runs <tspan class="mono">fetch.py</tspan> on each scheduled refresh;</text>
  <text x="396" y="171">the lookback catches revised values</text>

  <rect class="stage hinge" x="316" y="214" width="360" height="68" rx="6"/>
  <text x="332" y="253" class="h">check</text>
  <text x="396" y="244">rows against the declaration: types, key,</text>
  <text x="396" y="261">codes, example queries, published figures</text>

  <rect class="stage" x="316" y="304" width="360" height="68" rx="6"/>
  <text x="332" y="343" class="h">store</text>
  <text x="396" y="334">one convention for time (UTC) and units;</text>
  <text x="396" y="351">Parquet, one file per month or day</text>

  <rect class="stage" x="316" y="394" width="360" height="68" rx="6"/>
  <text x="332" y="433" class="h">serve</text>
  <text x="396" y="424">the dataset card, and DuckDB SQL that is</text>
  <text x="396" y="441">read-only and capped (rows, time, memory)</text>

  <line class="l-data" x1="496" y1="194" x2="496" y2="212" marker-end="url(#a-data)"/>
  <line class="l-data" x1="496" y1="284" x2="496" y2="302" marker-end="url(#a-data)"/>
  <line class="l-data" x1="496" y1="374" x2="496" y2="392" marker-end="url(#a-data)"/>

  <line class="sep" x1="316" y1="474" x2="676" y2="474"/>
  <text x="332" y="507" class="h">status</text>
  <text x="396" y="498"><tspan class="ok">&#9679;</tspan> ok or <tspan class="bad">&#9679;</tspan> failing, shown in every answer.</text>
  <text x="396" y="515">A failed fetch or check alerts the admin.</text>

  <!-- inputs -->
  <line class="l-data" x1="240" y1="158" x2="314" y2="158" marker-end="url(#a-data)"/>
  <text x="270" y="151" class="t-data lab" text-anchor="middle">rows</text>
  <line class="l-decl" x1="240" y1="248" x2="314" y2="248" marker-end="url(#a-decl)"/>
  <text x="270" y="241" class="t-decl lab" text-anchor="middle">declares</text>

  <!-- agent -->
  <rect class="frame" x="744" y="84" width="196" height="456" rx="10"/>
  <rect class="l glyph" x="758" y="98" width="18" height="14" rx="3"/>
  <path class="l glyph" d="M762 102 l3.5 3 l-3.5 3 M768 108.5 h4.5"/>
  <text x="784" y="111" class="h">Agent</text>
  <text x="758" y="133" class="m">uses the adele CLI,</text>
  <text x="758" y="149" class="m">taught by the adele skill</text>

  <circle class="l-m" cx="766" cy="176" r="8"/>
  <text x="766" y="180" class="num" text-anchor="middle">1</text>
  <text x="781" y="180" class="mono b">adele list</text>
  <text x="758" y="198">what exists, and how fresh</text>

  <circle class="l-m" cx="766" cy="224" r="8"/>
  <text x="766" y="228" class="num" text-anchor="middle">2</text>
  <text x="781" y="228" class="mono b">adele describe &lt;id&gt;</text>
  <text x="758" y="246">the card: grain, units,</text>
  <text x="758" y="262">warnings, sample rows</text>

  <circle class="l-m" cx="766" cy="288" r="8"/>
  <text x="766" y="292" class="num" text-anchor="middle">3</text>
  <text x="781" y="292" class="mono b">adele query "&lt;sql&gt;"</text>
  <text x="758" y="310">rows, followed by units,</text>
  <text x="758" y="326">warnings and freshness</text>

  <circle class="l-m" cx="766" cy="352" r="8" stroke-dasharray="3 2.5"/>
  <text x="766" y="356" class="num m" text-anchor="middle">4</text>
  <text x="781" y="356" class="mono b m">adele pull &lt;id&gt;</text>
  <text x="758" y="374" class="m">a local copy of the Parquet</text>
  <text x="758" y="390" class="m">files (not built yet)</text>

  <line class="sep" x1="758" y1="402" x2="926" y2="402"/>
  <text x="758" y="424" class="m">over HTTPS, with one API</text>
  <text x="758" y="440" class="m">key per team member</text>
  <line class="sep" x1="758" y1="474" x2="926" y2="474"/>
  <text x="758" y="498" class="m">Four steps, each one cheap</text>
  <text x="758" y="515" class="m">in tokens.</text>

  <!-- questions and answers -->
  <line class="l" x1="744" y1="417" x2="678" y2="417" marker-end="url(#a)"/>
  <text x="718" y="410" class="lab" text-anchor="middle">SQL</text>
  <line class="l" x1="676" y1="439" x2="742" y2="439" marker-end="url(#a)"/>
  <text x="718" y="455" class="lab" text-anchor="middle">answer</text>
</svg>
