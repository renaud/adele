<svg xmlns="http://www.w3.org/2000/svg" width="960" height="943" viewBox="0 0 960 943" role="img" aria-labelledby="title desc">
  <title id="title">adele: what an agent reads</title>
  <desc id="desc">Excerpts of the text that adele prints for three commands: adele list (one line per dataset), adele describe (the dataset card: status, freshness, warnings, grain, coverage, resolution, fields, sample rows) and adele query (the rows, then a footer with units, resolution, freshness and warnings). Colour separates what a person wrote in the dataset folder from what the server computed.</desc>

  <!-- Hand-written. The session is real output (2026-11-14), shortened: lines left out, long lines wrapped.
       A command starts a block: list at y 100, describe at 233, the two queries at 672 and 873. Inside a block, each
       line is 17 lower than the one before. The last line of a block and the next command are 48 apart.
       Notes on the right sit on the line they explain. -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #1f2328 }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px }
    .sub { font-size: 13.5px }
    .b { font-weight: 600 }
    .m { fill: #59636e }
    .bg { fill: #ffffff }
    .term { fill: #f6f8fa; stroke: #d0d7de }
    .tick { stroke: #8c959f }
    .k { fill: #59636e }                      /* keys and fixed text */
    .c { fill: #1f2328; font-weight: 600 }    /* the command */
    .a { fill: #1f2328 }                      /* its arguments */
    .p { fill: #9a6700 }                      /* written by a person */
    .s { fill: #0969da }                      /* computed by the server */
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3 }
      .m { fill: #9198a1 }
      .bg { fill: #0d1117 }
      .term { fill: #161b22; stroke: #30363d }
      .tick { stroke: #6e7681 }
      .k { fill: #9198a1 }
      .c { fill: #e6edf3 }
      .a { fill: #e6edf3 }
      .p { fill: #d29922 }
      .s { fill: #58a6ff }
    }
  </style>

  <rect class="bg" width="960" height="943"/>

  <!-- legend -->
  <text x="20" y="30" class="m sub">Text that adele prints, here for the day-ahead prices of ENTSO-E on 2026-11-14. Excerpts: lines are left out, long lines are wrapped.</text>
  <rect class="p" x="20" y="47" width="10" height="10" rx="2"/>
  <text x="36" y="56.5">written by a person (datapackage.yaml, checks.yaml)</text>
  <rect class="s" x="372" y="47" width="10" height="10" rx="2"/>
  <text x="388" y="56.5">computed by the server</text>
  <rect class="a" x="556" y="47" width="10" height="10" rx="2"/>
  <text x="572" y="56.5">typed by the agent</text>

  <rect class="term" x="20" y="76" width="684" height="847" rx="8"/>

  <!-- 1 list: 6 lines from y 100 -->
  <text class="mono k" xml:space="preserve"><tspan x="36" y="100">$ </tspan><tspan class="c">adele list</tspan>
    <tspan x="36" dy="17">id | title | resolution | coverage (UTC, first and last interval start) | status</tspan>
    <tspan x="36" dy="17" class="p">entsoe_day_ahead_prices</tspan> | <tspan class="p">Day-ahead prices per bidding zone (ENTSO-E)</tspan> | <tspan class="s">PT15M, PT1H</tspan> |
    <tspan x="36" dy="17">    </tspan><tspan class="s">2014-12-31 23:00Z .. 2026-11-14 22:45Z</tspan> | <tspan class="s">ok</tspan>
    <tspan x="36" dy="17" class="p">weathernext3</tspan> | <tspan class="p">WeatherNext 3 forecasts of solar radiation and cloud cover, Switzerland</tspan> |
    <tspan x="36" dy="17">    </tspan><tspan class="s">PT1H, instants</tspan> | <tspan class="s">init_time 2024-11-12 00:00Z .. 2026-11-12 05:00Z</tspan> | <tspan class="s">ok</tspan>
  </text>

  <!-- 2 describe: 24 lines from y 233 -->
  <text class="mono k" xml:space="preserve"><tspan x="36" y="233">$ </tspan><tspan class="c">adele describe</tspan><tspan class="a"> entsoe_day_ahead_prices</tspan>
    <tspan x="36" dy="17">status: </tspan><tspan class="s">ok</tspan>
    <tspan x="36" dy="17">freshness:</tspan>
    <tspan x="36" dy="17">  last_fetched_at: </tspan><tspan class="s">2026-11-13 20:05Z</tspan>
    <tspan x="36" dy="17">  next_fetch_eta: </tspan><tspan class="s">2026-11-13 21:05Z</tspan>
    <tspan x="36" dy="17">published_figures: &gt;-</tspan>
    <tspan x="36" dy="17">  82 figures published by </tspan><tspan class="p">ElCom, SMARD (Bundesnetzagentur), Keles et al. 2020, CRE, RTE</tspan>
    <tspan x="36" dy="17">  are recomputed from this data after each fetch: </tspan><tspan class="s">all match</tspan>
    <tspan x="36" dy="17">warnings:</tspan>
    <tspan x="36" dy="17">- </tspan><tspan class="p">The delivery day is defined in CET/CEST, not UTC.</tspan>
    <tspan x="36" dy="17">tables:</tspan>
    <tspan x="36" dy="17">- table: </tspan><tspan class="p">entsoe_day_ahead_prices.prices</tspan>
    <tspan x="36" dy="17">  grain: one row per (</tspan><tspan class="p">bidding_zone, delivery_start</tspan>)
    <tspan x="36" dy="17">  coverage: </tspan><tspan class="s">2014-12-31 23:00Z .. 2026-11-14 22:45Z</tspan> (first and last interval start)
    <tspan x="36" dy="17">  resolution:</tspan>
    <tspan x="36" dy="17">  - '</tspan><tspan class="s">CH: PT1H 2014-12-31 23:00Z .. 2026-11-03 22:00Z</tspan>'
    <tspan x="36" dy="17">  - '</tspan><tspan class="s">CH: PT15M 2026-11-03 23:00Z .. 2026-11-14 22:45Z</tspan>'
    <tspan x="36" dy="17">  fields:</tspan>
    <tspan x="36" dy="17">  - name: </tspan><tspan class="p">price</tspan>
    <tspan x="36" dy="17">    type: </tspan><tspan class="p">number</tspan> (<tspan class="s">DOUBLE</tspan>)
    <tspan x="36" dy="17">    unit: </tspan><tspan class="p">EUR/MWh</tspan>
    <tspan x="36" dy="17">  sample_rows: |</tspan>
    <tspan x="36" dy="17">    </tspan><tspan class="s">bidding_zone,delivery_start,resolution,price</tspan>
    <tspan x="36" dy="17">    </tspan><tspan class="s">CH,2015-05-19 05:00:00Z,PT1H,40.19</tspan>
  </text>

  <!-- 3 query: 10 lines from y 672 -->
  <text class="mono k" xml:space="preserve"><tspan x="36" y="672">$ </tspan><tspan class="c">adele query</tspan><tspan class="a"> "SELECT year(delivery_start AT TIME ZONE 'Europe/Zurich') AS year,</tspan>
    <tspan x="36" dy="17" class="a">    round(avg(price), 2) AS avg_price FROM entsoe_day_ahead_prices.prices</tspan>
    <tspan x="36" dy="17" class="a">    WHERE bidding_zone = 'CH' AND </tspan>[...]<tspan class="a"> GROUP BY 1 ORDER BY 1"</tspan>
    <tspan x="36" dy="17" class="s">year,avg_price</tspan>
    <tspan x="36" dy="17" class="s">2022,281.65</tspan>
    <tspan x="36" dy="17" class="s">2023,107.47</tspan>
    <tspan x="36" dy="17" class="s">2024,75.96</tspan>
    <tspan x="36" dy="17">-- </tspan><tspan class="p">entsoe_day_ahead_prices</tspan>: units: <tspan class="p">price EUR/MWh</tspan>. resolution: <tspan class="s">CH PT1H, PT15M from</tspan>
    <tspan x="36" dy="17">   </tspan><tspan class="s">2026-11-03 23:00Z</tspan>; [...] status <tspan class="s">ok</tspan>, last fetched <tspan class="s">2026-11-13 20:05Z</tspan>.
    <tspan x="36" dy="17">-- warning (</tspan><tspan class="p">entsoe_day_ahead_prices</tspan>): <tspan class="p">The delivery day is defined in CET/CEST, not UTC.</tspan>
  </text>

  <!-- a capped result: 3 lines from y 873 -->
  <text class="mono k" xml:space="preserve"><tspan x="36" y="873">$ </tspan><tspan class="c">adele query</tspan><tspan class="a"> "SELECT delivery_start, price FROM </tspan>[...]<tspan class="a"> ORDER BY 1"</tspan>
    <tspan x="36" dy="17">[...]</tspan>
    <tspan x="36" dy="17">-- showing </tspan><tspan class="s">100</tspan> of <tspan class="s">25,968</tspan> rows. Aggregate, or narrow the filter.
  </text>

  <!-- notes: a tick at the line, then the text -->
  <g>
    <line class="tick" x1="708" y1="96" x2="718" y2="96"/>
    <text x="724" y="100" class="b">1  list</text>
    <text x="724" y="117">One line per dataset. Resolution</text>
    <text x="724" y="133">and coverage are read from the</text>
    <text x="724" y="149">stored data.</text>

    <line class="tick" x1="708" y1="229" x2="718" y2="229"/>
    <text x="724" y="233" class="b">2  describe</text>
    <text x="724" y="250">The dataset card. First: is the</text>
    <text x="724" y="266">data fresh, and did the checks</text>
    <text x="724" y="282">pass?</text>

    <line class="tick" x1="708" y1="314" x2="718" y2="314"/>
    <text x="724" y="318">Figures published by others are</text>
    <text x="724" y="334">recomputed after each fetch. One</text>
    <text x="724" y="350">that differs sets failing.</text>

    <line class="tick" x1="708" y1="382" x2="718" y2="382"/>
    <text x="724" y="386">Traps, in the words of a person</text>
    <text x="724" y="402">who knows the dataset.</text>

    <line class="tick" x1="708" y1="433" x2="718" y2="433"/>
    <text x="724" y="437">What one row is. The server</text>
    <text x="724" y="453">checks that this key is unique.</text>

    <line class="tick" x1="708" y1="484" x2="718" y2="484"/>
    <text x="724" y="488">Periods per zone, read from the</text>
    <text x="724" y="504">data: here CH moves from 1 hour</text>
    <text x="724" y="520">to 15 minutes.</text>

    <line class="tick" x1="708" y1="552" x2="718" y2="552"/>
    <text x="724" y="556">The declared type and unit, next</text>
    <text x="724" y="572">to the type that is stored.</text>

    <line class="tick" x1="708" y1="603" x2="718" y2="603"/>
    <text x="724" y="607">Sample rows show the real</text>
    <text x="724" y="623">formats of the values.</text>

    <line class="tick" x1="708" y1="668" x2="718" y2="668"/>
    <text x="724" y="672" class="b">3  query</text>
    <text x="724" y="689">DuckDB SQL, run on the server:</text>
    <text x="724" y="705">read-only, capped in rows, time</text>
    <text x="724" y="721">and memory.</text>

    <line class="tick" x1="708" y1="787" x2="718" y2="787"/>
    <text x="724" y="791">Every result ends with units,</text>
    <text x="724" y="807">resolution, freshness and</text>
    <text x="724" y="823">warnings: an agent that skipped</text>
    <text x="724" y="839">describe still gets them.</text>

    <line class="tick" x1="708" y1="869" x2="718" y2="869"/>
    <text x="724" y="873">Results are capped. A capped</text>
    <text x="724" y="889">result says so, and says what</text>
    <text x="724" y="905">to do next.</text>
  </g>
</svg>
