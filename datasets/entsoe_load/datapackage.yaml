# Definitions (titles, descriptions, labels, warnings, questions) are Renaud's (skills/add-dataset).
# On 2026-11-15 he asked Claude to write them: every definition below is a draft by Claude until
# he changes or confirms it. Structure (keys, types, refresh) by Claude, WP3 step 4. Renaud
# confirmed the unit (MW, as served) and the one-hour move of the actual load before 2025.
# Sources of the facts: the docstring of fetch.py, and swissgrid_project/data/entsoe/README.md
# (QA 5 c5 and c7) for the comparison with Swissgrid's Energy Statistic.
name: entsoe_load
title: Total load per bidding zone, actual and day-ahead forecast (ENTSO-E)  # draft by Claude
# draft by Claude
description: >-
  Total load of each bidding zone as published on the ENTSO-E Transparency Platform (document
  A65): the actual load (table actual, process type A16) and its day-ahead forecast (table
  forecast, process type A01). Total load is the generation plus imports minus exports and minus
  the power used for energy storage, losses included (Regulation (EU) 543/2013, article 6). For
  CH the data comes from Swissgrid. Every version that adele fetched is kept (revisions:
  append-only).
# The same platform as entsoe_day_ahead_prices: Renaud's licence entry there, copied by Claude.
licenses:
  - name: CC-BY-4.0
    path: https://creativecommons.org/licenses/by/4.0/
    title: Creative Commons Attribution 4.0 International License
resources:
  - name: actual
    description: Actual total load per delivery interval (A65, process type A16).  # draft by Claude
    schema:
      primaryKey: [bidding_zone, delivery_start]
      fields:
        - name: bidding_zone
          type: string
          description: Short zone name.  # draft by Claude
          categories:
            - {value: CH, label: Switzerland}
        - name: delivery_start
          type: datetime
          # draft by Claude
          description: >-
            Start of the delivery interval, UTC. ENTSO-E served the Swiss actual load with the end
            of the hour as its stamp until 2024-12-31 22:00 UTC; adele moves those values back by
            one hour, so they start at the hour they cover.
        - name: resolution
          type: duration
          description: Length of the delivery interval.  # draft by Claude
        - name: load
          type: number
          unit: MW
          description: Actual total load, mean power over the delivery interval, as published.  # draft by Claude
  - name: forecast
    description: Day-ahead forecast of the total load per delivery interval (A65, process type A01), published the day before delivery.  # draft by Claude
    schema:
      primaryKey: [bidding_zone, delivery_start]
      fields:
        - name: bidding_zone
          type: string
          description: Short zone name.  # draft by Claude
          categories:
            - {value: CH, label: Switzerland}
        - name: delivery_start
          type: datetime
          description: Start of the delivery interval, UTC.
        - name: resolution
          type: duration
          description: Length of the delivery interval.  # draft by Claude
        - name: load
          type: number
          unit: MW
          description: Day-ahead forecast of the total load, mean power over the delivery interval.  # draft by Claude
adele:
  format_version: 1
  secrets: [ENTSO_TOKEN]
  refresh:
    every: PT1H
    # No correction was seen in 15 days (fetch.py); 14 days cost two small requests per hour
    # and catch a correction up to two weeks late. Also the time for which a failed stretch is
    # retried. Proposal by Claude.
    lookback: P14D
    horizon: P2D    # the forecast of the next day
  revisions: append-only
  # drafts by Claude
  warnings:
    - >-
      CH: the actual load is not the Swiss consumption of Swissgrid's Energy Statistic. Its level
      is lower by 230 to 460 MW from Nov 2016 to Dec 2018, by 260 to 470 MW in Sep-Dec 2023 and
      by 300 to 390 MW in Jul-Dec 2024 (monthly medians); in Jan-Aug 2023 and in 2026 it differs
      hour by hour by up to 1 GW. Where the level matters, use the Energy Statistic.
    - >-
      CH: the actual load jumps by about +350 MW on average at 2025-01-01, where ENTSO-E changed
      the stamps (no value at 2024-12-31 22:00 UTC). From January to August 2023 the actual load
      follows the Energy Statistic at no offset (correlation of hourly changes 0.25 or less,
      monthly median gap 380 to 590 MW): it is not the measured load then, and the one-hour move
      of those months is assumed, as for the rest of the time before 2025.
    - >-
      CH: the actual load has stretches far below the forecast, as published: 3,747 MW repeated
      from 2023-02-16 23:00 to 2023-02-17 08:00 UTC, about 3,000 MW from 2024-12-04 23:00 to
      2024-12-05 21:00 UTC, about half the forecast on the nights of 2026-11-03, 2026-11-10 and
      2026-11-14.
    - "CH: the forecast has no value from 2015-08-30 22:00 to 2015-08-31 21:00 UTC."
    - >-
      CH: from September 2021 to December 2022 the forecast is a copy of the actual load as
      ENTSO-E serves it (stamped at the end of the hour): equal in at least 99.9 % of the hours
      of September 2021 and of every month of 2022 except September (89.7 %), and in 75 % and
      90 % of October and November 2021. It is not a forecast then: its "error" over those
      months is the change of the load from one hour to the next.
    - >-
      CH: the stamps of the forecast are kept as served, and their timing is not settled. The
      forecast fits the actual load best one hour earlier in 2015-2018 and in January-August 2023
      (as if stamped at the end of the hour), at the same hour in 2019-2021 and from October
      2023. An error of the forecast depends on that choice: 2015-2021, MAE 416.6 MW with
      ENTSO-E's stamps of the actual load, 439.5 MW with adele's.
  # D31: five checks of checks.yaml, one per trap; chosen by Claude (2026-11-15), they replace
  # two examples that nobody had confirmed (Renaud asked for published figures instead).
  examples:
    - check: ch_2019_consumption_twh  # energy from mean power: MW x the duration of each row
    - check: ch_2019_entsoe_peak_hour_mw  # ENTSO-E's hour 18:00 is adele's 17:00 before 2025
    - check: ch_2024_min_mw  # the glitch of 2024-12-05 is ENTSO-E's published minimum: kept as served
    - check: ch_2015_2021_forecast_mae_mw  # a forecast error depends on how the two series' stamps line up
    - check: ch_2021_naive_weekly_mape  # a local year, and a lag of 168 rows as a join on time
