  # Kazmi & Tao compared ENTSO-E's forecast and actual load as served (ENTSO-E's stamps), 2015-2021,
  # after filtering "anomalous measurements" with a filter they don't describe: adele gives MAE
  # 416.6 and ME -69.8 with ENTSO-E's stamps (439.5 and -69.8 with adele's). Tolerances cover their
  # filter, not rounding. Their R2 (.74; adele .729) and WAPE (5.84; adele 5.87) are left out.
  - name: ch_2015_2021_forecast_mae_mw
    question: "Mean absolute error of the day-ahead load forecast of CH against the actual load, 2015-2021, with ENTSO-E's stamps of the actual load, MW"
    sql: |
      SELECT avg(abs(a.load - f.load))
      FROM entsoe_load.forecast f
      JOIN entsoe_load.actual a
        ON a.bidding_zone = f.bidding_zone
       AND a.delivery_start + INTERVAL 1 HOUR = f.delivery_start  -- ENTSO-E's stamps of the actual load
      WHERE f.bidding_zone = 'CH'
        AND f.delivery_start >= TIMESTAMPTZ '2015-01-01 00:00:00Z'
        AND f.delivery_start <  TIMESTAMPTZ '2022-01-01 00:00:00Z'
    expected: 416
    tolerance: 5
    source: "Kazmi & Tao 2022, Applied Energy 323:119565, Table 1, p.13 (preprint), https://lirias.kuleuven.be/retrieve/d4e0320a-92c6-409a-b024-fdd2e8e8e551"
  - name: ch_2015_2021_forecast_me_mw
    question: "Mean error (actual - forecast) of the day-ahead load forecast of CH, 2015-2021, with ENTSO-E's stamps of the actual load, MW"
    sql: |
      SELECT avg(a.load - f.load)
      FROM entsoe_load.forecast f
      JOIN entsoe_load.actual a
        ON a.bidding_zone = f.bidding_zone
       AND a.delivery_start + INTERVAL 1 HOUR = f.delivery_start  -- ENTSO-E's stamps of the actual load
      WHERE f.bidding_zone = 'CH'
        AND f.delivery_start >= TIMESTAMPTZ '2015-01-01 00:00:00Z'
        AND f.delivery_start <  TIMESTAMPTZ '2022-01-01 00:00:00Z'
    expected: -68
    tolerance: 3
    source: "Kazmi & Tao 2022, Applied Energy 323:119565, Table 1, p.13 (preprint), https://lirias.kuleuven.be/retrieve/d4e0320a-92c6-409a-b024-fdd2e8e8e551"
  # Tzortzis et al.: a naive forecast (the same hour a week before), MAPE over 2021 in local time.
  - name: ch_2021_naive_weekly_mape
    question: "MAPE (%) of a naive forecast of the actual load of CH by the value 168 hours before, 2021 (local year)"
    sql: |
      SELECT 100 * avg(abs(a.load - p.load) / a.load)
      FROM entsoe_load.actual a
      JOIN entsoe_load.actual p
        ON p.bidding_zone = a.bidding_zone
       AND p.delivery_start = a.delivery_start - INTERVAL 168 HOUR
      WHERE a.bidding_zone = 'CH'
        AND a.delivery_start >= TIMESTAMPTZ '2021-01-01 00:00:00+01'
        AND a.delivery_start <  TIMESTAMPTZ '2022-01-01 00:00:00+01'
    expected: 6.25
    tolerance: 0.006
    source: "Tzortzis et al. 2023, arXiv 2310.15555v1, Table 2, sNaive(168), Switzerland, https://arxiv.org/html/2310.15555"
