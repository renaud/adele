    tolerance: 0.5
    source: "ENTSO-E, Statistical Factsheet 2019, Highest and lowest hourly load values of each country, CH, https://eepublicdownloads.entsoe.eu/clean-documents/Publications/Statistics/Factsheet/entsoe_sfs2019_web.pdf"
