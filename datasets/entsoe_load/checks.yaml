# Published figures that this dataset must reproduce (Renaud 2026-11-13: "the figures ARE the QA").
# Collected 2026-11-15 by a research agent, compared with adele the same day
# (qa/tools/published_check_entsoe_load.py; qa/published_figures_entsoe_load.md lists the figures
# left out and why).
#
# ENTSO-E Statistical Factsheets 2019-2025: "based upon data reported to the ENTSO-E Central
# Transparency Platform"; hourly values are "the average of the hour", "All times are in UTC", and
# an hour "18:00-19:00" starts at 18:00. They use ENTSO-E's stamps: before 2024-12-31 23:00 UTC
# adele's stamp of the actual load is one hour earlier (fetch.py), so each hour below is the
# factsheet's hour minus one hour until 2024. Every hourly value matches at that hour.
# Tolerance: 0.5 for MW published as whole numbers, 0.05 for TWh published to 0.1.
# Years are UTC years, as in the factsheets.
checks:
  - name: ch_2019_consumption_twh
    question: "Actual total load of CH in 2019 (UTC year), TWh"
    sql: |
      SELECT sum(load * epoch(resolution) / 3600) / 1e6
      FROM entsoe_load.actual
      WHERE bidding_zone = 'CH'
        AND delivery_start >= TIMESTAMPTZ '2019-01-01 00:00:00Z'
        AND delivery_start <  TIMESTAMPTZ '2020-01-01 00:00:00Z'
    expected: 63.4
    tolerance: 0.05
    source: "ENTSO-E, Statistical Factsheet 2019, ENTSO-E in figures, Consumption, CH (net consumption), https://eepublicdownloads.entsoe.eu/clean-documents/Publications/Statistics/Factsheet/entsoe_sfs2019_web.pdf"
  - name: ch_2019_max_mw
    question: "Highest hourly actual load of CH in 2019 (UTC year), MW"
    sql: |
      SELECT max(load)
      FROM entsoe_load.actual
      WHERE bidding_zone = 'CH'
        AND delivery_start >= TIMESTAMPTZ '2019-01-01 00:00:00Z'
        AND delivery_start <  TIMESTAMPTZ '2020-01-01 00:00:00Z'
    expected: 9924
    tolerance: 0.5
    source: "ENTSO-E, Statistical Factsheet 2019, Highest and lowest hourly load values of each country, CH, https://eepublicdownloads.entsoe.eu/clean-documents/Publications/Statistics/Factsheet/entsoe_sfs2019_web.pdf"
  - name: ch_2019_min_mw
    question: "Lowest hourly actual load of CH in 2019 (UTC year), MW"
