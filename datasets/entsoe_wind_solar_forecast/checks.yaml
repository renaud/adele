  #
  # The checks below read another dataset: the actual generation of CH, entsoe_generation.generation
  # (D34, Renaud 2026-11-16). They fail while that dataset is missing or holds other values; its own
  # checks say which of the two datasets moved. Compared on 2026-11-16 with the backfill of the
  # worktree wp5.2 (WP5.2); figures that differ are in qa/published_figures_entsoe_wind_solar_forecast.md.
  # Zsiborács 2022 Table 3 and 2023 Table 2, 2017: their share counts an hour only when the actual has a
  # value too; the actual misses 23 hours from 2017-10-28, the forecast none. Tolerance 0.05.
  # Zsiborács 2022 Table A5 (wind) and 2023 Table 6 (PV): "downward regulation need" = the energy
  # produced above the day-ahead forecast, "upward" = the forecast energy not produced, each as a share
  # of the year's actual energy, over the hours with both values. Local years (UTC years give the same
  # matches). Tolerance 0.05: one decimal.
  # Kazmi & Tao 2022, Tables 2 and 3: R2 of the day-ahead forecast against the actual, hourly, 2017-2021
  # (UTC). Their ME and MAE differ by up to 6 MW (an undescribed filter of 5-10 % of the values): left
  # out. R2 tolerance 0.005: two decimals.
  - name: ch_2017_wind_day_ahead_completeness_with_actual_pct
    question: "Share of 2017 (local year) with both a Swiss day-ahead wind forecast and an actual value (entsoe_generation), %"
    sql: |
      SELECT 100 * sum(epoch(f.resolution))
             / epoch(TIMESTAMPTZ '2018-01-01 00:00:00 Europe/Zurich' - TIMESTAMPTZ '2017-01-01 00:00:00 Europe/Zurich')
      FROM entsoe_wind_solar_forecast.forecast f
      JOIN entsoe_generation.generation a
        ON a.bidding_zone = 'CH' AND a.production_type = f.production_type AND a.delivery_start = f.delivery_start
      WHERE f.area = 'CH' AND f.forecast_type = 'day_ahead' AND f.production_type = 'wind_onshore'
        AND a.generation IS NOT NULL
        AND f.delivery_start >= TIMESTAMPTZ '2017-01-01 00:00:00 Europe/Zurich'
        AND f.delivery_start <  TIMESTAMPTZ '2018-01-01 00:00:00 Europe/Zurich'
    expected: 99.7
    tolerance: 0.05
    source: "Zsiborács, Pintér, Vincze & Baranyai 2022, Wind Power Generation Scheduling Accuracy in Europe: An Overview of ENTSO-E Countries, Sustainability 14(24):16446, Table 3, CH, 2017 DA, https://www.mdpi.com/2071-1050/14/24/16446"
  - name: ch_2017_solar_day_ahead_completeness_with_actual_pct
    question: "Share of 2017 (local year) with both a Swiss day-ahead solar forecast and an actual value (entsoe_generation), %"
    sql: |
      SELECT 100 * sum(epoch(f.resolution))
             / epoch(TIMESTAMPTZ '2018-01-01 00:00:00 Europe/Zurich' - TIMESTAMPTZ '2017-01-01 00:00:00 Europe/Zurich')
      FROM entsoe_wind_solar_forecast.forecast f
      JOIN entsoe_generation.generation a
        ON a.bidding_zone = 'CH' AND a.production_type = f.production_type AND a.delivery_start = f.delivery_start
      WHERE f.area = 'CH' AND f.forecast_type = 'day_ahead' AND f.production_type = 'solar'
        AND a.generation IS NOT NULL
        AND f.delivery_start >= TIMESTAMPTZ '2017-01-01 00:00:00 Europe/Zurich'
        AND f.delivery_start <  TIMESTAMPTZ '2018-01-01 00:00:00 Europe/Zurich'
    expected: 99.7
    tolerance: 0.05
    source: "Zsiborács, Vincze, Pintér & Hegedűsné Baranyai 2023, The Accuracy of PV Power Plant Scheduling in Europe: An Overview of ENTSO-E Countries, IEEE Access 11, Table 2 (p. 74959), CH, 2017 DA, https://doi.org/10.1109/ACCESS.2023.3297494"
  - name: ch_2015_wind_day_ahead_downward_need_pct
    question: "Swiss wind in 2015 (local year): energy produced above the day-ahead forecast, % of the actual energy (entsoe_generation; downward regulation need)"
    sql: |
      SELECT 100 * sum(greatest(a.generation - f.generation, 0)) / sum(a.generation)
      FROM entsoe_wind_solar_forecast.forecast f
      JOIN entsoe_generation.generation a
        ON a.bidding_zone = 'CH' AND a.production_type = f.production_type AND a.delivery_start = f.delivery_start
      WHERE f.area = 'CH' AND f.forecast_type = 'day_ahead' AND f.production_type = 'wind_onshore'
        AND a.generation IS NOT NULL
        AND f.delivery_start >= TIMESTAMPTZ '2015-01-01 00:00:00 Europe/Zurich'
        AND f.delivery_start <  TIMESTAMPTZ '2016-01-01 00:00:00 Europe/Zurich'
    expected: 18.9
    tolerance: 0.05
    source: "Zsiborács, Pintér, Vincze & Baranyai 2022, Wind Power Generation Scheduling Accuracy in Europe: An Overview of ENTSO-E Countries, Sustainability 14(24):16446, Table A5, CH, 2015, downward regulation need, https://www.mdpi.com/2071-1050/14/24/16446"
