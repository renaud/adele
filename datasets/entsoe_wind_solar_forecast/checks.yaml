        AND f.delivery_start <  TIMESTAMPTZ '2018-01-01 00:00:00 Europe/Zurich'
    expected: 16.6
    tolerance: 0.05
    source: "Zsiborács, Vincze, Pintér & Hegedűsné Baranyai 2023, The Accuracy of PV Power Plant Scheduling in Europe: An Overview of ENTSO-E Countries, IEEE Access 11, Table 6 (p. 74965), CH, 2017, upward regulation need, https://doi.org/10.1109/ACCESS.2023.3297494"
  - name: ch_2019_solar_day_ahead_downward_need_pct
    question: "Swiss solar in 2019 (local year): energy produced above the day-ahead forecast, % of the actual energy (entsoe_generation; downward regulation need)"
    sql: |
      SELECT 100 * sum(greatest(a.generation - f.generation, 0)) / sum(a.generation)
      FROM entsoe_wind_solar_forecast.forecast f
      JOIN entsoe_generation.generation a
        ON a.bidding_zone = 'CH' AND a.production_type = f.production_type AND a.delivery_start = f.delivery_start
      WHERE f.area = 'CH' AND f.forecast_type = 'day_ahead' AND f.production_type = 'solar'
        AND a.generation IS NOT NULL
        AND f.delivery_start >= TIMESTAMPTZ '2019-01-01 00:00:00 Europe/Zurich'
        AND f.delivery_start <  TIMESTAMPTZ '2020-01-01 00:00:00 Europe/Zurich'
    expected: 5.3
    tolerance: 0.05
    source: "Zsiborács, Vincze, Pintér & Hegedűsné Baranyai 2023, The Accuracy of PV Power Plant Scheduling in Europe: An Overview of ENTSO-E Countries, IEEE Access 11, Table 6 (p. 74965), CH, 2019, downward regulation need, https://doi.org/10.1109/ACCESS.2023.3297494"
