  - name: ch_2017_2021_wind_day_ahead_r2
    question: "R2 of the Swiss day-ahead wind forecast against the actual (entsoe_generation), hourly, 2017-2021 (UTC years)"
    sql: |
      SELECT corr(a.generation, f.generation) ^ 2
      FROM entsoe_wind_solar_forecast.forecast f
      JOIN entsoe_generation.generation a
        ON a.bidding_zone = 'CH' AND a.production_type = f.production_type AND a.delivery_start = f.delivery_start
      WHERE f.area = 'CH' AND f.forecast_type = 'day_ahead' AND f.production_type = 'wind_onshore'
        AND a.generation IS NOT NULL
        AND f.delivery_start >= TIMESTAMPTZ '2017-01-01 00:00:00+00'
        AND f.delivery_start <  TIMESTAMPTZ '2022-01-01 00:00:00+00'
    expected: 0
    tolerance: 0.005
    source: "Kazmi & Tao 2022, How good are TSO load and renewable generation forecasts ..., Applied Energy 323:119565, Table 2, CH, R2, https://lirias.kuleuven.be/retrieve/672627"
