# Published figures that this dataset must reproduce (Renaud 2026-11-13: "the figures ARE the QA").
# Collected 2026-11-15 by Claude: two web searches by research agents and the literature PDFs of
# predico_enlab (docs/literature_review/pdfs/); compared with adele the same day
# (qa/tools/published_check_entsoe_wind_solar_forecast.py; qa/published_figures_entsoe_wind_solar_forecast.md
# lists the figures left out and why). The checks at the end read entsoe_generation too (D34).
#
# Zsiborács et al. 2022, Table 3: "the completeness of the databases of the DA and ID onshore wind farm
# forecasts" (%), CH, 60-min data, per year. Their share also drops the hours without an actual value
# (2017: 99.7 % there, 100 % of the hours with a forecast); the years below have no hole in the actual,
# so the share of the year's time with a forecast reproduces them. Years in local time (CET/CEST); UTC
# years give the same values. Tolerance 0.05: the figures have one decimal.
# Zsiborács et al. 2023, Table 2: the same for the day-ahead solar forecast (an image in the PDF, read by
# eye at 300 dpi; PDF downloaded by Renaud, adele/tmp/ on 2026-11-15). 2016 (99.5) and 2017 (99.7) differ,
# as for wind: see the notes.
checks:
  - name: ch_2015_wind_day_ahead_completeness_pct
    question: "Share of 2015 (local year) covered by the Swiss day-ahead wind forecast, %"
    sql: |
      SELECT 100 * sum(epoch(resolution))
             / epoch(TIMESTAMPTZ '2016-01-01 00:00:00 Europe/Zurich' - TIMESTAMPTZ '2015-01-01 00:00:00 Europe/Zurich')
      FROM entsoe_wind_solar_forecast.forecast
      WHERE area = 'CH' AND forecast_type = 'day_ahead' AND production_type = 'wind_onshore'
        AND delivery_start >= TIMESTAMPTZ '2015-01-01 00:00:00 Europe/Zurich'
        AND delivery_start <  TIMESTAMPTZ '2016-01-01 00:00:00 Europe/Zurich'
    expected: 99.2
    tolerance: 0.05
    source: "Zsiborács, Pintér, Vincze & Baranyai 2022, Wind Power Generation Scheduling Accuracy in Europe: An Overview of ENTSO-E Countries, Sustainability 14(24):16446, Table 3, CH, 2015 DA, https://www.mdpi.com/2071-1050/14/24/16446"
