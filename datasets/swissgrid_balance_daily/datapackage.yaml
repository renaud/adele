# Definitions (titles, descriptions, warnings) are Renaud's (skills/add-dataset). Every
# definition below is a draft by Claude (WP4, 2026-11-15) until he changes or confirms it; the
# signs and the unit of the price come from SED (sources/ch_swissgrid/README.md, source.yaml).
# Structure (keys, types, refresh) by Claude, from WP4 points 1 to 8 (accepted by Renaud on
# 2026-11-15) and the measures in docs/work-packages/WP4-files-overwritten-or-revised.md.
# The price is converted from ct/kWh to EUR/MWh at ingestion: to confirm before the first
# fetches on steacher1 (a later change can't convert the stored versions).
name: swissgrid_balance_daily
title: Balance of the Swiss control area, the last 24 hours as first published (Swissgrid)  # draft by Claude
# draft by Claude
description: >-
  Balance of the Swiss control area per quarter-hour, from Swissgrid's file
  control-area-balance-daily.csv, which holds the last 24 hours and gains a quarter-hour every 15
  minutes: the Total System Imbalance (TSI), the balancing energy activated (aFRR, mFRR), the
  imbalance netting (NRV), the frequency restoration control error (FRCE) and the provisional
  imbalance price. Each version that adele saw is kept: the first published values (some rows
  come first with only a TSI value) and their corrections within the 24 hours. For the history,
  use swissgrid_balance (Swissgrid's year files), which holds the same columns.
resources:
  - name: balance
    description: One row per quarter-hour.  # draft by Claude
    schema:
      primaryKey: [delivery_start]
      fields:
        - name: delivery_start
          type: datetime
          description: Start of the quarter-hour, UTC.  # draft by Claude
        - {name: afrr_up, type: number, unit: MW, description: "aFRR+ activated in CH (Abgedeckte Bedarf der aFRR+), >= 0."}  # draft by Claude
        - {name: afrr_dn, type: number, unit: MW, description: "aFRR- activated in CH, <= 0."}  # draft by Claude
        - {name: sa_mfrr_up, type: number, unit: MW, description: "Scheduled-activation mFRR+ (SA mFRR+), >= 0."}  # draft by Claude
        - {name: sa_mfrr_dn, type: number, unit: MW, description: "Scheduled-activation mFRR-, <= 0."}  # draft by Claude
        - {name: da_mfrr_up, type: number, unit: MW, description: "Direct-activation mFRR+ (DA mFRR+), >= 0."}  # draft by Claude
        - {name: da_mfrr_dn, type: number, unit: MW, description: "Direct-activation mFRR-, <= 0."}  # draft by Claude
        - {name: nrv_import, type: number, unit: MW, description: "Imbalance netting (IGCC), import, >= 0."}  # draft by Claude
        - {name: nrv_export, type: number, unit: MW, description: "Imbalance netting (IGCC), export, <= 0."}  # draft by Claude
        - {name: frce_import, type: number, unit: MW, description: "Frequency restoration control error (the part left uncorrected), import, >= 0."}  # draft by Claude
        - {name: frce_export, type: number, unit: MW, description: "Frequency restoration control error, export, <= 0."}  # draft by Claude
        - name: tsi
          type: number
          unit: MW
          # draft by Claude
          description: >-
            Total System Imbalance, before any balancing action: TSI = -(the sum of the ten
            columns before it). > 0 = the control area is long (a surplus), < 0 = short.
        - name: price_single
          type: number
          unit: EUR/MWh
          # draft by Claude
          description: >-
            Provisional single imbalance price (AE-Preis), published in EUR-cent/kWh and
            converted (x10). > 0 = a short balance group pays, a long one receives. Swissgrid
            may change it weeks later: the final price is in its monthly price files.
adele:
  format_version: 1
  refresh:
    every: PT5M      # as the poller
    # The oldest row is about 24 h 45 min old: a lookback of 2 days keeps every row of the file,
    # so a correction of the oldest row is kept too.
    lookback: P2D
    horizon: PT0S
    timeout: PT2M
  revisions: append-only
  raw: keep
  resolution:
    - {from: "2026-09-26", value: PT15M}
  # drafts by Claude
  warnings:
    - >-
      A recent row may be a placeholder: every column blank but tsi. A later version fills the
      columns and may move tsi by about 0.1 MW. 13 of 2,029 quarter-hours came so in the
      Swissgrid poller's archive (2026-09-27 to 2026-10-17), filled within hours.
    - >-
      price_single is provisional. In the year file, prices changed up to 3.5 days after
      delivery (by up to 230 EUR/MWh) and 4 to 7 weeks after (by up to 1.5 EUR/MWh).
