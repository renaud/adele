# Published figures that this dataset must reproduce (skills/add-dataset, step 8). Collected
# 2026-11-15 by two research agents, checked against adele on 2026-11-16 (Claude): every figure
# below matches. The figures left out and why: qa/published_figures_entsoe_imbalance_prices.md.
#
# ElCom computed its figures on Swissgrid's own prices, which equal ENTSO-E's A85 in every
# quarter-hour of 2023 and 2024 (swissgrid project, QA 3). Its quarter-hours are local times,
# the start of the quarter-hour (21 of the 24 single quarter-hours of its Table 4 match at that
# stamp, none in UTC). Its years are Europe/Zurich years (UTC years give the same counts).
# 2017-2021: ElCom's row "AEP long" holds the counts that adele has in price_short (A05, large
# positive prices), and its row "AEP short" is 0 where adele's price_long is 0; from 2022 the
# labels agree. The checks follow adele's columns. Shown to Renaud as a finding.
# BNetzA's reBAP: German local times, the start of the quarter-hour.
# Tolerance: 0 for counts; 0.5 for prices printed as whole numbers, 0.05 for one decimal,
# 0.005 for two decimals.
checks:
  - name: ch_2025_price_short_abs_over_2000
    question: "CH: quarter-hours of 2025 (Europe/Zurich year) with |price_short| > 2000 EUR/MWh"
    sql: |
      SELECT count(*)
      FROM entsoe_imbalance_prices.prices
      WHERE area = 'CH' AND abs(price_short) > 2000
        AND delivery_start >= TIMESTAMPTZ '2025-01-01 00:00:00 Europe/Zurich'
        AND delivery_start <  TIMESTAMPTZ '2026-01-01 00:00:00 Europe/Zurich'
    expected: 15
    tolerance: 0
    source: "ElCom, Besondere Ereignisse in der Regelzone Schweiz im Jahr 2025 (May 2026), p. 15, Tabelle 2, https://www.elcom.admin.ch/dam/it/sd-web/lpdgJ8PUh5mk/Bericht%20Besondere%20Ereignisse%20in%20der%20Regelzone%20Schweiz%202025.pdf"
