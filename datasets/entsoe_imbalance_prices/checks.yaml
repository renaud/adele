  - name: de_lu_2017_10_17_max
    question: "DE_LU: highest imbalance price (reBAP, single price) of 2017-10-17 (Europe/Berlin day), EUR/MWh"
    sql: |
      SELECT max(price_short)
      FROM entsoe_imbalance_prices.prices
      WHERE area = 'DE_LU'
        AND delivery_start >= TIMESTAMPTZ '2017-10-17 00:00:00 Europe/Berlin'
        AND delivery_start <  TIMESTAMPTZ '2017-10-18 00:00:00 Europe/Berlin'
    expected: 24455.05
