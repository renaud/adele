                   avg(from_ch) AS exp, avg(to_ch) AS imp
            FROM entsoe_scheduled_exchanges.total
            WHERE delivery_start >= TIMESTAMPTZ '2021-01-01 00:00:00Z'
              AND delivery_start <  TIMESTAMPTZ '2022-01-01 00:00:00Z'
            GROUP BY 1, 2)
    expected: 22.4389533175
    tolerance: 0.00002
    source: "Buckley & Schaefer, Annual imports, exports and balances for European bidding zones, TIB LDM4Energy, comm_flows_total_annual_sums_2021.csv, CH, Exports Netted, https://doi.org/10.71694/1b92fgz8"
