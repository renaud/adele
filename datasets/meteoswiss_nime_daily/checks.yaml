    source: "MeteoSwiss, Klimabulletin 2015, Jahreswerte an ausgewählten MeteoSchweiz-Messstationen p. 5, Zürich, https://www.meteoschweiz.admin.ch/dam/jcr:0efb9b33-1372-430c-a42b-782cd74c9442/klimabulletin_jahr_2015.pdf"
