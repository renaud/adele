    expected: 92.16
    tolerance: 0.015
    source: "EPEX Power Trading Results 12-2025 (2026-01-06), p. 8, ID3 DE (60 min), local copy swissgrid_project/papers/EPEX_2026_Power_Trading_Results_2025-12.pdf (EPEX's download center refuses scripts)"
