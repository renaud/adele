    expected: 187.33
    tolerance: 0.015
    source: "EPEX Power Trading Results 12-2025 (2026-01-06), p. 6, CH IDA1 base, local copy swissgrid_project/papers/EPEX_2026_Power_Trading_Results_2025-12.pdf (EPEX's download center refuses scripts)"
  - name: ch_2025_12_ida1_peak
    question: "Mean IDA1 auction price, CH, 2025-12 (local month), Monday to Friday 08:00-20:00 local (EPEX's peak)"
    sql: |
      SELECT avg(ida1)
      FROM energy_charts_intraday_prices.prices WHERE bidding_zone = 'CH'
      AND delivery_start >= timezone('Europe/Zurich', TIMESTAMP '2025-12-01')
      AND delivery_start < timezone('Europe/Zurich', TIMESTAMP '2026-01-01')
      AND isodow(delivery_start AT TIME ZONE 'Europe/Zurich') <= 5
      AND hour(delivery_start AT TIME ZONE 'Europe/Zurich') BETWEEN 8 AND 19
    expected: 125.9
    tolerance: 0.015
    source: "EPEX Power Trading Results 12-2025 (2026-01-06), p. 6, CH IDA1 peak, local copy swissgrid_project/papers/EPEX_2026_Power_Trading_Results_2025-12.pdf (EPEX's download center refuses scripts)"
