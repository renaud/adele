# Published figures that this dataset must reproduce (skills/add-dataset, step 8; D12). The server runs every
# query after each fetch; a result outside the tolerance sets the status to failing.
#
# Collected 2026-11-15 by Claude (WP5.4): EPEX SPOT's monthly "Power Trading Results" of 2025-09 and 2025-12, compared
# with qa/tools/published_check_energy_charts_intraday_prices.py; notes in
# qa/published_figures_energy_charts_intraday_prices.md. EPEX's download center refuses scripts (HTTP 403): only these
# two reports could be read; the other months wait for a download by hand. Generated once by a script of the session
# (gen_checks_wp54.py, scratchpad); edit this file directly from now on.
#
# Conventions: local months (Europe/Zurich). Base = every hour of the month; peak = Monday to Friday 08:00-20:00 local.
# EPEX gives cents: tolerance 0.015. Left out: CH ID Full of 2025-12 (112.89 published, 112.906 here; see the notes).
checks:
  - name: de_lu_2025_12_id_avg_base
    question: "Mean continuous intraday average price (EPEX ID Full), DE_LU, 2025-12 (local month), every hour (EPEX's base)"
    sql: |
      SELECT avg(id_avg)
      FROM energy_charts_intraday_prices.prices WHERE bidding_zone = 'DE_LU'
      AND delivery_start >= timezone('Europe/Zurich', TIMESTAMP '2025-12-01')
      AND delivery_start < timezone('Europe/Zurich', TIMESTAMP '2026-01-01')
    expected: 92.39
    tolerance: 0.015
    source: "EPEX Power Trading Results 12-2025 (2026-01-06), p. 8, ID Full DE (60 min), local copy swissgrid_project/papers/EPEX_2026_Power_Trading_Results_2025-12.pdf (EPEX's download center refuses scripts)"
  - name: de_lu_2025_12_id3_base
