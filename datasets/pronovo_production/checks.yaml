# Published figures that this dataset must reproduce (skills/add-dataset, step 8). Collected
# 2026-11-15 by Claude (qa/tools/published_check_pronovo_production.py; notes in
# qa/published_figures_pronovo_production.md).
#
# Pronovo's own sums: the last row of Lastgangprofile_11.2020.csv (Archiv/2020/DE/) holds the sum
# of each column over the file, in kWh to 0.01. The file runs from the local end stamp 01.11.2020
# 00:15 to 01.12.2020 00:00, so the sums cover the local month of November 2020 (Europe/Zurich).
# On the UTC month the same sums differ (hydro by -931 MWh): these checks test the end stamps and
# the zone of the month. Tolerance: 0.005 kWh, half the rounding of the published value.
#
# BFE's monthly balance of Swiss electricity (net production, whole GWh): the nuclear of 2023.
# BFE has it from the operators, not from these files, so the tolerance is wider than the
# rounding: 1 % (233 GWh), because the two sources meter differently and Pronovo's nuclear is
# 1.000 to 1.014 times BFE's in each month of 2023 to 2026 that has every unit in the file. The
# check fails when a unit is missing from the files of a month (0.66 of BFE in Sep 2024, Feb and
# Mar 2025). 2024 and 2025 are left out for that reason (qa/published_figures_pronovo_production.md).
#
# BFE's reference market prices (Art. 15 EnFV), collected 2026-11-16: BFE computes a monthly
# volume per technology from these files (the quarterly definitive ones), as net production, -A
# minus +A (method note, section 3.3, https://pubdb.bfe.admin.ch/de/publication/download/11467).
# Hydro is five categories (without storage and pumped storage), biomass five (with the
# renewable half of waste incineration). 156 figures, 2023-07 to 2026-09 (the CSV of
# 2026-10-13), whole MWh: all match, the largest difference is 0.49994 MWh. Tolerance 0.5 MWh,
# half the rounding. Generated by qa/tools/rmp_checks_pronovo_production.py (it also adds the
# months that BFE publishes later). They test the local month, the net production, the
# categories, and that adele holds the definitive file of each quarter.
# Before 2023-07, BFE published the PV volume per quarter (pubdb 9319, 2018 to 2023/2), as -A
# alone: 2022/3, 2023/1 and 2023/2 match to 0.4 MWh; the 11 other quarters of 2020-2022 differ by
# -3.9 to +0.6 %, unexplained (qa/published_figures_pronovo_production.md).
checks:
  - name: rmp_pv_2022_q3_mwh
    question: "PV energy delivered (-A, not net) in the third quarter of 2022 (local months July to September, Europe/Zurich), MWh"
    sql: |
      SELECT sum(production_mwh)
      FROM pronovo_production.by_technology
      WHERE technology = 'pv'
        AND delivery_start >= TIMESTAMPTZ '2022-07-01 00:00:00+02'
        AND delivery_start <  TIMESTAMPTZ '2022-10-01 00:00:00+02'
    expected: 718445
    tolerance: 0.5
    source: "BFE, Referenz-Marktpreise gemäss Art. 15 EnFV (14 September 2023), table of quarters (Quartalspreis, Quartalsvolumen PV), 2022/3, Quartalsvolumen PV, https://pubdb.bfe.admin.ch/de/publication/download/9319"
  - name: rmp_pv_2023_q1_mwh
