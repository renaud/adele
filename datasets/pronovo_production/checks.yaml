    source: "BFE, Referenz-Marktpreise gemäss Art. 15 EnFV (14 September 2023), table of quarters (Quartalspreis, Quartalsvolumen PV), 2023/2, Quartalsvolumen PV, https://pubdb.bfe.admin.ch/de/publication/download/9319"
