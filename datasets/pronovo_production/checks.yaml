        AND delivery_start >= TIMESTAMPTZ '2023-01-01 00:00:00+01'
        AND delivery_start <  TIMESTAMPTZ '2023-04-01 00:00:00+02'
    expected: 288183
    tolerance: 0.5
    source: "BFE, Referenz-Marktpreise gemäss Art. 15 EnFV (14 September 2023), table of quarters (Quartalspreis, Quartalsvolumen PV), 2023/1, Quartalsvolumen PV, https://pubdb.bfe.admin.ch/de/publication/download/9319"
