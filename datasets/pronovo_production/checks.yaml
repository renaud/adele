    source: "BFE, Elektrizitätsbilanz der Schweiz - Monatswerte, in GWh (updated 30.10.2026), sheet Tabelle1, Kernkraftwerke, January to December 2023, https://pubdb.bfe.admin.ch/de/publication/download/5634"
