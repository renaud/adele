    sql: |
      SELECT sum(production_mwh - coalesce(auxiliary_mwh, 0))
      FROM pronovo_production.by_technology
      WHERE technology = 'pv'
        AND delivery_start >= TIMESTAMPTZ '2026-09-01 00:00:00+02'
        AND delivery_start <  TIMESTAMPTZ '2026-10-01 00:00:00+02'
    expected: 546630
    tolerance: 0.5
    source: "BFE, Referenz-Marktpreise gemäss Art. 15 EnFV, monthly volumes, column Volume_pv_MWh, https://www.bfe-ogd.ch/ogd60_rmp_monatspreise.csv (method: https://pubdb.bfe.admin.ch/de/publication/download/11467, section 3.3)"
