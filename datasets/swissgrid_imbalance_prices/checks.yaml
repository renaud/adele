    sql: |
      SELECT avg(p.price_single) FILTER (WHERE p.price_single <= d.price)
      FROM swissgrid_imbalance_prices.prices p
      JOIN entsoe_day_ahead_prices.prices d ON d.bidding_zone = 'CH' AND p.delivery_start >= d.delivery_start
