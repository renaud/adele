  - name: week_2025_12_29_short
    question: "Mean single imbalance price over the quarter-hours where it is above the CH day-ahead price (ElCom: the control area short), week of 2025-12-29 (local, Monday to Sunday)"
    sql: |
      SELECT avg(p.price_single) FILTER (WHERE p.price_single > d.price)
      FROM swissgrid_imbalance_prices.prices p
      JOIN entsoe_day_ahead_prices.prices d ON d.bidding_zone = 'CH' AND p.delivery_start >= d.delivery_start
      AND p.delivery_start < d.delivery_start + d.resolution
      WHERE p.delivery_start >= timezone('Europe/Zurich', TIMESTAMP '2025-12-29')
      AND p.delivery_start < timezone('Europe/Zurich', TIMESTAMP '2025-12-29' + INTERVAL 7 DAY)
    expected: 157
    tolerance: 0.5
    source: "ElCom, Marktbericht vom 13.01.2026, p. 7, table Ausgleichsenergiepreis, column Vorwoche, https://www.elcom.admin.ch/dam/de/sd-web/HG2LlaF939U5/Marktbericht%20vom%2013-01-2026.pdf"
