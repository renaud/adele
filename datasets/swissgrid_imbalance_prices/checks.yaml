    sql: |
      SELECT strftime(delivery_start AT TIME ZONE 'Europe/Zurich', '%H%M')::INTEGER
      FROM swissgrid_imbalance_prices.prices
      WHERE delivery_start >= TIMESTAMPTZ '2026-05-19 00:00:00+02' AND delivery_start < TIMESTAMPTZ '2026-05-20 00:00:00+02'
      ORDER BY price_single LIMIT 1
    expected: 1245
    tolerance: 0.5
