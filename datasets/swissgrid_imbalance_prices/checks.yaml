# Published figures that this dataset must reproduce (skills/add-dataset, step 8; D12). The server runs every
# query after each fetch; a result outside the tolerance sets the status to failing.
#
# Collected 2026-11-15 by Claude (WP5.4): ElCom's weekly market reports of 2025-11 to 2026-08 found by web search
# (23 reports, read with pdftotext), compared with qa/tools/published_check_swissgrid_imbalance_prices.py; notes and
# the figures left out in qa/published_figures_swissgrid_imbalance_prices.md. Generated once by a script of the
# session (gen_checks_wp54.py, scratchpad); edit this file directly from now on.
#
# Conventions: weeks run from Monday 00:00 to Monday 00:00, local time (Europe/Zurich), as in ElCom's charts.
# ElCom gives whole EUR/MWh: tolerance 0.5. 2025 (dual price): ElCom's "AE+ (short)" and "AE- (long)" are the plain
# means of price_short and price_long. 2026 (single price): ElCom's "AE short / long" are the means of the single price
# over the quarter-hours when the control area was short (TSI < 0) or long (TSI > 0). adele has no TSI (it is in
# Swissgrid's control-area file, WP4), so these checks use a stand-in: the quarter-hours where the single price is
# above, or at or below, the CH day-ahead price (entsoe_day_ahead_prices). Only the weeks where both the stand-in and
# ElCom's own definition (with the TSI of SED's copy of the control-area file) give ElCom's two figures are here.
checks:
  - name: week_2025_10_27_short
    question: "Mean imbalance price of a short balance group (price_short, plain mean), week of 2025-10-27 (local, Monday to Sunday)"
    sql: |
      SELECT avg(price_short)
      FROM swissgrid_imbalance_prices.prices p
      WHERE p.delivery_start >= timezone('Europe/Zurich', TIMESTAMP '2025-10-27')
      AND p.delivery_start < timezone('Europe/Zurich', TIMESTAMP '2025-10-27' + INTERVAL 7 DAY)
    expected: 249
    tolerance: 0.5
    source: "ElCom, Marktbericht vom 11.11.2025, p. 7, table Ausgleichsenergiepreis, column Vorwoche, https://www.elcom.admin.ch/dam/fr/sd-web/VlO6g6OJTrQE/Marktbericht%20vom%2011-11-2025.pdf"
