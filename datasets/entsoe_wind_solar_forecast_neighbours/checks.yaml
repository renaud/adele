  - name: at_2015_onshore_day_ahead_completeness_pct
    question: "Share of 2015 (local year, Brussels) covered by the day-ahead onshore wind forecast of Austria, %"
    sql: |
      SELECT 100 * coalesce(sum(epoch(resolution)), 0)
             / epoch(TIMESTAMPTZ '2016-01-01 00:00:00 Europe/Brussels' - TIMESTAMPTZ '2015-01-01 00:00:00 Europe/Brussels')
      FROM entsoe_wind_solar_forecast_neighbours.forecast
      WHERE area = 'AT'
        AND forecast_type = 'day_ahead' AND production_type = 'wind_onshore'
        AND delivery_start >= TIMESTAMPTZ '2015-01-01 00:00:00 Europe/Brussels'
        AND delivery_start <  TIMESTAMPTZ '2016-01-01 00:00:00 Europe/Brussels'
    expected: 100
    tolerance: 0.05
    source: "Zsiborács, Pintér, Vincze & Baranyai 2022, Wind Power Generation Scheduling Accuracy in Europe: An Overview of ENTSO-E Countries, Sustainability 14(24):16446, Table 3, AT, 2015 DA, https://www.mdpi.com/2071-1050/14/24/16446"
