# Published figures that this dataset must reproduce (Renaud 2026-11-13: "the figures ARE the QA").
# Collected 2026-11-15 by Claude: two web searches by research agents and the literature PDFs of
# predico_enlab (docs/literature_review/pdfs/); compared with adele the same day
# (qa/tools/published_check_entsoe_wind_solar_forecast_neighbours.py;
# qa/published_figures_entsoe_wind_solar_forecast_neighbours.md lists the figures left out and why).
# Written by a one-off generator (gen_checks_neighbours.py, session scratchpad); edit this file directly.
#
# Conventions:
# - Germany in Ben Amor & Ziel and in the eclipse brief = the sum of the four TSO areas: it reproduces
#   their figures, DE_LU does not from 2022 (it holds Luxembourg too). Germany in Zsiborács = the
#   bidding zone, DE_AT_LU until 2018-09-30, then DE_LU.
# - Ben Amor & Ziel: hours are the mean of their quarter-hours; their periods read as local days, the
#   end included. Their unit is written MWh, the values are GW.
# - Zsiborács 2022 (wind) and 2023 (PV; its Table 2 is an image, read by eye at 300 dpi), completeness: the share of the local year (Brussels) with a forecast value. Their share
#   also drops the intervals without an actual value, which this dataset can't check: only the
#   figures that match are here (AT intraday 2018 matches in local years only).
# - The eclipse brief's "12:00 CET" = the interval that starts at 11:00 UTC.
# Tolerances: half the last digit of the published value (0.05 for one decimal, 0.5 for whole MW);
# the eclipse values are rounded to 1,000 MW (Germany) and 100 MW (France, Austria): 500 and 50.
checks:
  - name: de_2018_2021_wind_mean_gw
    question: "Mean of the hourly German day-ahead wind (onshore + offshore) forecast, sum of the four TSO areas, local days 01.10.2018-14.01.2022, GW"
    sql: |
      WITH q AS (
        SELECT delivery_start, sum(generation) AS mw
        FROM entsoe_wind_solar_forecast_neighbours.forecast
        WHERE area IN ('DE_50HZ', 'DE_AMPRION', 'DE_TENNET', 'DE_TRANSNETBW') AND forecast_type = 'day_ahead' AND production_type IN ('wind_onshore', 'wind_offshore')
          AND delivery_start >= TIMESTAMPTZ '2018-10-01 00:00:00 Europe/Berlin'
          AND delivery_start <  TIMESTAMPTZ '2022-01-15 00:00:00 Europe/Berlin'
        GROUP BY delivery_start),
      h AS (SELECT date_trunc('hour', delivery_start) AS hour_start, avg(mw) / 1e3 AS gw FROM q GROUP BY 1)
      SELECT avg(gw) FROM h
    expected: 14.1
    tolerance: 0.05
    source: "Ben Amor & Ziel 2026, Recurrent Neural Networks with Linear Structures for Electricity Price Forecasting, arXiv 2512.04690v2, Appendix, Table 7, 01.10.2018-14.01.2022 (calibration window), https://arxiv.org/html/2512.04690"
  - name: de_2018_2021_wind_std_gw
    question: "Standard deviation of the hourly German day-ahead wind (onshore + offshore) forecast, sum of the four TSO areas, local days 01.10.2018-14.01.2022, GW"
