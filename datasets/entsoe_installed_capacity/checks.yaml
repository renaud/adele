# Published figures that this dataset must reproduce (skills/add-dataset, step 8). Collected
# 2026-11-15 by a research agent, checked against adele on 2026-11-16 (Claude): every figure
# matches. Notes and the figures left out: qa/published_figures_entsoe_installed_capacity.md.
#
# ENTSO-E's Statistical Factsheets 2019, 2020, 2022 and 2024, table "Net Generation Capacity":
# "based upon data reported to the ENTSO-E Central Transparency Platform", capacity "as of 1st
# of January" of the year, in whole MW (run-of-river 604.5 prints as 605). Tolerance 0.5.
checks:
  - name: ch_2019_nuclear_mw
    question: "CH: installed capacity of B14 (nuclear) for 2019, MW"
    sql: |
      SELECT capacity
      FROM entsoe_installed_capacity.capacity
      WHERE area = 'CH' AND psr_type = 'B14'
        AND delivery_year = DATE '2019-01-01'
    expected: 3373
    tolerance: 0.5
    source: "ENTSO-E, Statistical Factsheet 2019, table Net Generation Capacity, CH, https://eepublicdownloads.entsoe.eu/clean-documents/Publications/Statistics/Factsheet/entsoe_sfs2019_web.pdf"
  - name: ch_2019_pumped_storage_mw
    question: "CH: installed capacity of B10 (pumped storage) for 2019, MW"
    sql: |
