# Published figures that this dataset must reproduce (skills/add-dataset, step 8).
# Collected 2026-11-15 by a research agent, compared with adele the same day
# (qa/tools/published_check_entsoe_physical_flows.py; qa/published_figures_entsoe_physical_flows.md
# lists the figures left out and why).
#
# ENTSO-E Statistical Factsheets 2019-2025, "Physical energy flows" map, CH borders: "Hourly netted
# physical flow values", GWh. In each UTC hour the two directions are netted (the mean power of
# each direction over the hour: DE has quarter-hours from 2021-08), and each direction sums its
# positive part. GWh printed as whole numbers: tolerance 0.5. Years are UTC years. Only the
# figures that match now are here: 19 of 56. All 8 of the 2025 edition (made in June 2026)
# match; the older editions (made from March 2023 to March 2025) differ by 0.01 to 0.9 %, most
# likely by the corrections that ENTSO-E made after them (flows are corrected up to a year after
# delivery). A later correction can make one of these checks fail: then compare with the next
# edition.
checks:
  - name: ch_to_de_2020_gwh
    question: "Physical flow CH --> DE in 2020 (UTC year), netted per hour, GWh"
    sql: |
      SELECT sum(greatest(net, 0)) / 1e3
      FROM (SELECT time_bucket(INTERVAL 1 HOUR, delivery_start) AS hour, avg(from_ch) - avg(to_ch) AS net
            FROM entsoe_physical_flows.flows
            WHERE border = 'DE'
              AND delivery_start >= TIMESTAMPTZ '2020-01-01 00:00:00Z'
              AND delivery_start <  TIMESTAMPTZ '2021-01-01 00:00:00Z'
            GROUP BY 1)
    expected: 5171
    tolerance: 0.5
    source: "ENTSO-E, Statistical Factsheet 2020, Physical energy flows, CH --> DE, https://eepublicdownloads.entsoe.eu/clean-documents/Publications/Statistics/Factsheet/entsoe_sfs2020_web.pdf"
