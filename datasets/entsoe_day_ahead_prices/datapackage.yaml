# Definitions (titles, descriptions, labels, warnings, questions) are written by Renaud
# (skills/add-dataset). Text taken from the sketch in SPEC.md is his. TODO(Renaud) marks the
# definitions that are still missing; the agent does not fill them.
name: entsoe_day_ahead_prices
title: Day-ahead prices per bidding zone (ENTSO-E)
description: >-
  Day-ahead prices of the bidding zones CH, DE_LU (DE_AT_LU until 2018-09-30) and FR, from the ENTSO-E Transparency Platform, since 2015.
licenses:
  - name: CC-BY-4.0
    path: https://creativecommons.org/licenses/by/4.0/
    title: Creative Commons Attribution 4.0 International License
resources:
  - name: prices
    schema:
      primaryKey: [bidding_zone, delivery_start]
      fields:
        - name: bidding_zone
          type: string
          description: Short zone name. Zones change over time (DE_AT_LU ended 2018-10-01).
          categories:
            - {value: CH, label: Switzerland}
            - {value: DE_LU, label: Germany-Luxembourg}
            - {value: DE_AT_LU, label: Germany-Luxembourg-Austria}
            - {value: FR, label: France}
        - name: delivery_start
          type: datetime
          description: Start of the delivery interval, UTC.
        - name: resolution
          type: duration
          description: >-
            Length of the delivery interval: PT1H, then PT15M from a date that differs per zone
            (see the warnings). To average prices or count hours, weight each row by it:
            sum(price * epoch(resolution)) / sum(epoch(resolution)).
        - name: price
          type: number
          unit: EUR/MWh
adele:
  format_version: 1
  secrets: [ENTSO_TOKEN]
  refresh:
    every: PT1H  # proposal: prices of the next day appear around 13:00 CET
    lookback: P3D
    horizon: P2D
  revisions: overwrite
  # The sketch's `resolution` periods (PT1H from 2015-01-01, PT15M from 2025-10-01) are left
  # out: the server computes the periods per zone from the `resolution` column.
  warnings:
    - >-
      A plain average over a period that spans the switch to 15 minutes gives the 15-minute
      rows 4 times the weight of the hourly rows. The switch: FR on 2025-09-30 (that day has 4
      equal values per hour, as published), DE_LU on 2025-10-01, CH on 2026-11-04.
    - The delivery day is defined in CET/CEST, not UTC.
    - "coverage of 2015: DE_AT_LU and FR start on 2015-01-05, CH on 2015-01-01."
    - "2024-06-26: EPEX's auction for DE_LU, FR and four other zones was decoupled; ENTSO-E carries the coupled price."
  examples:
    - question: Average day-ahead price in CH per delivery day in March 2026?
      sql: |
        SELECT CAST(delivery_start AT TIME ZONE 'Europe/Zurich' AS DATE) AS delivery_day,
                 avg(price) AS avg_price
        FROM entsoe_day_ahead_prices.prices
        WHERE bidding_zone = 'CH'
          AND delivery_start >= TIMESTAMPTZ '2026-03-01 00:00:00+01'
          AND delivery_start <  TIMESTAMPTZ '2026-04-01 00:00:00+02'
        GROUP BY 1
        ORDER BY 1
      verified_at: 2026-11-15
    # Examples that name a check of checks.yaml: describe prints the check's question and SQL,
    # and the published figure that the SQL reproduces (D31). Chosen by Claude for the trap that
    # each one shows.
    - check: de_2025_mean  # a mean weighted by duration, across the switch of 2025-10-01
    - check: de_2024_negative_hours  # hours as a sum of durations; DE_AT_LU, then DE_LU
    - check: fr_2025_negative_hours_hourly_mean  # quarter-hours averaged to hours first (RTE)
    - check: ch_2022_mean_of_daily_means  # days cut in Europe/Zurich, each a mean by duration
