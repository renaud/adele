# Published figures that this dataset must reproduce (TODOs.md, V0; Renaud 2026-11-13: "the
# figures ARE the QA"). The server runs every query after each fetch; a result outside the
# tolerance sets the status to failing. The describe card shows one line about them, not the list.
#
# Collected 2026-11-13 (qa/published_figures.md). Figures that differ from adele for a known
# reason are left out and explained there (2015 coverage from 2015-01-05, DE 2018 and DE 2025
# negative hours, CH 2016 std, FR 2015 mean).
#
# Tolerance: 0.015 for figures published to the cent (the published value is rounded, and one
# cent of disagreement is allowed), 0.05 for CRE's figure rounded to 0.1, 0.5 for hour counts.
# Germany is DE_AT_LU until 2018-09-30 and DE_LU from 2018-10-01. Years are local (CET/CEST).
checks:
  - name: de_2016_negative_hours
    question: "Hours with a negative day-ahead price, Germany (DE_AT_LU, then DE_LU from 2018-10-01), 2016 (local year)"
    sql: |
      SELECT coalesce(sum(epoch(resolution)) FILTER (WHERE price < 0), 0) / 3600
      FROM entsoe_day_ahead_prices.prices
      WHERE bidding_zone IN ('DE_AT_LU', 'DE_LU')
        AND delivery_start >= TIMESTAMPTZ '2016-01-01 00:00:00+01'
        AND delivery_start <  TIMESTAMPTZ '2017-01-01 00:00:00+01'
    expected: 97
    tolerance: 0.5
    source: "ElCom, Analyse der negativen Preise 2015-2020 (Jan 2021), Tabelle 1, p.33, https://www.elcom.admin.ch/dam/en/sd-web/QuXm2cRVxBau/analysedernegativenpreisefuerdieschweizfrankreichunddeutschlandzwischen2015und2020.pdf"
