  - name: fr_2025_negative_hours_hourly_mean
    question: "Hours whose mean price (over their quarter-hours) is negative, FR, 2025 (RTE's definition)"
    sql: |
      SELECT count(*) FROM (
        SELECT date_trunc('hour', delivery_start) AS hour,
               sum(price * epoch(resolution)) / sum(epoch(resolution)) AS hour_mean
        FROM entsoe_day_ahead_prices.prices
        WHERE bidding_zone = 'FR'
          AND delivery_start >= TIMESTAMPTZ '2025-01-01 00:00:00+01'
          AND delivery_start <  TIMESTAMPTZ '2026-01-01 00:00:00+01'
        GROUP BY hour)
      WHERE hour_mean < 0
    expected: 513
    tolerance: 0.5
    source: "RTE, Bilan electrique 2025, principaux resultats, p.13, https://assets.rte-france.com/prod/public/2026-02/Bilan-electrique-2025-principaux-resultats.pdf"
