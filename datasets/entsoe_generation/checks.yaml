# Published figures that this dataset must reproduce (skills/add-dataset, step 8).
# Collected 2026-11-15 by a research agent, compared with adele the same day
# (qa/tools/published_check_entsoe_generation.py; qa/published_figures_entsoe_generation.md lists
# the figures left out and why).
#
# ENTSO-E Statistical Factsheets 2019-2025, table "ENTSO-E in figures", CH, net generation per type:
# "based upon data reported to the ENTSO-E Central Transparency Platform". 2023 is left out: its
# footnote says that the Swiss values are taken from SFOE and Pronovo. TWh printed to 0.1:
# tolerance 0.05. Years are UTC years (the factsheets give their hours in UTC; local years give
# the same result for every figure here). Energy = MW x the duration of each row.
checks:
  - name: ch_2019_nuclear_twh
    question: "Actual generation of CH, nuclear, in 2019 (UTC year), TWh"
    sql: |
      SELECT sum(generation * epoch(resolution) / 3600) / 1e6
      FROM entsoe_generation.generation
      WHERE production_type = 'nuclear'
        AND delivery_start >= TIMESTAMPTZ '2019-01-01 00:00:00Z'
        AND delivery_start <  TIMESTAMPTZ '2020-01-01 00:00:00Z'
    expected: 25.7
    tolerance: 0.05
    source: "ENTSO-E, Statistical Factsheet 2019, ENTSO-E in figures, CH, Nuclear, https://eepublicdownloads.entsoe.eu/clean-documents/Publications/Statistics/Factsheet/entsoe_sfs2019_web.pdf"
  - name: ch_2020_nuclear_twh
    question: "Actual generation of CH, nuclear, in 2020 (UTC year), TWh"
