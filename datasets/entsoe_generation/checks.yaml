      SELECT sum(generation * epoch(resolution) / 3600) / 1e6
      FROM entsoe_generation.generation
      WHERE production_type = 'wind_onshore'
        AND delivery_start >= TIMESTAMPTZ '2025-01-01 00:00:00Z'
        AND delivery_start <  TIMESTAMPTZ '2026-01-01 00:00:00Z'
    expected: 0.2
    tolerance: 0.05
